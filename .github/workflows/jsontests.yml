
name: Translation tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'custom_components/tuya_local/translations/*.json'
      - 'custom_components/tuya_local/icons.json'
  push:
    paths:
      - 'custom_components/tuya_local/translations/*.json'
      - 'custom_components/tuya_local/icons.json'

jobs:
  tests:
    if: (github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, asus-vivobook-s, asus-vivobook-s-vm]

    permissions:
      checks: write
      contents: read
      pull-requests: write

    strategy:
      matrix:
        python-version: ['3.14']

    env:
      UV_SYSTEM_PYTHON: 1

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Prepare isolated ASUS CI Python
        shell: bash
        run: |
          set -euo pipefail
          ci_venv="$RUNNER_TEMP/asus-ci-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB"
          python -m venv "$ci_venv"
          echo "$ci_venv/bin" >> "$GITHUB_PATH"
          echo "ASUS_CI_VENV=$ci_venv" >> "$GITHUB_ENV"
          echo "UV_PROJECT_ENVIRONMENT=$ci_venv" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Translations check with pytest
        run: uv run pytest tests/test_translations.py

      - name: Remove isolated ASUS CI Python
        if: always()
        shell: bash
        run: |
          if [[ -n "${ASUS_CI_VENV:-}" ]]; then
            case "$ASUS_CI_VENV" in
              "$RUNNER_TEMP"/asus-ci-*) rm -rf -- "$ASUS_CI_VENV" ;;
              *) echo 'Unexpected CI environment path'; exit 1 ;;
            esac
          fi
