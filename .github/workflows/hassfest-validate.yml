name: Validate with hassfest

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: [self-hosted, linux, x64, asus-vivobook-s, asus-vivobook-s-vm]
    permissions:
      contents: read
      pull-requests: write
    if: (github.repository_owner == 'make-all') && ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      - uses: actions/checkout@v6
      - uses: home-assistant/actions/hassfest@master
